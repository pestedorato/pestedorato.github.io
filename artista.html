    <!-- ============================================
    PESTE DO RATO - PÁGINA INDIVIDUAL DO ARTISTA
    
    Esta página carrega as informações do artista baseado no ID na URL.
    Exemplo: /artista.html?id=1 carrega o artista com ID 1
    
    COMO FUNCIONA:
    1. O JavaScript pega o ID da URL (?id=X)
    2. Busca os dados do artista no objeto ARTISTAS
    3. Preenche a página com as informações
    
    COMO ADICIONAR UM NOVO ARTISTA:
    1. Vá até o objeto ARTISTAS no final deste arquivo
    2. Adicione uma nova entrada com um ID único
    3. Preencha: nome, categoria, cidade, foto, biografia, redes sociais
    
    CATEGORIAS DISPONÍVEIS:
    - mc (MCs/Rappers)
    - dj (DJs)
    - breaking (B-Boys/B-Girls)
    - graffiti (Grafiteiros)
    - produtor (Produtores)
    - crew (Crews/Grupos)
    - batalha (Batalhas de Rap)
    - banda (Bandas de Rock/Metal)
    - solo (Artistas Solo Rock/Metal)
    
    Para linkar um artista no carrossel ou listagem, use:
    <a href="/artista.html?id=NUMERO">
    ============================================ -->

    <style>
        .artist-page {
            padding: 40px 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        
        .artist-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 40px;
        }
        
        .artist-photo {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid var(--cor-vermelho);
            margin-bottom: 20px;
        }
        
        .artist-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .artist-name-title {
            font-family: var(--fonte-titulo);
            font-size: clamp(2rem, 5vw, 3rem);
            color: var(--cor-texto);
            margin-bottom: 10px;
        }
        
        .artist-category {
            display: inline-block;
            background-color: var(--cor-vermelho);
            color: #fff;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        
        .artist-location {
            color: var(--cor-bege);
            font-size: 1.1rem;
        }
        
        .artist-bio {
            background-color: var(--cor-cinza);
            padding: 30px;
            border-radius: var(--card-radius);
            margin-bottom: 30px;
        }
        
        .artist-bio h2 {
            font-family: var(--fonte-titulo);
            font-size: 1.5rem;
            color: var(--cor-texto);
            margin-bottom: 15px;
        }
        
        .artist-bio p {
            font-family: 'Poppins', sans-serif;
            color: var(--cor-bege);
            line-height: 1.8;
            text-align: justify;
        }
        
        .artist-social {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }
        
        .artist-social a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            background-color: var(--cor-cinza);
            border-radius: 50%;
            transition: background-color var(--transition-rapida), transform var(--transition-rapida);
        }
        
        .artist-social a:hover {
            background-color: var(--cor-vermelho);
            transform: scale(1.1);
        }
        
        .artist-social svg {
            width: 24px;
            height: 24px;
            fill: var(--cor-texto);
        }
        
        .artist-not-found {
            text-align: center;
            padding: 60px 20px;
        }
        
        .artist-not-found h1 {
            font-family: var(--fonte-titulo);
            font-size: 2rem;
            color: var(--cor-vermelho);
            margin-bottom: 20px;
        }
        
        .artist-not-found p {
            color: var(--cor-bege);
            margin-bottom: 30px;
        }
        
        /* ============================================
           SEÇÃO DE DISCOGRAFIA (Embed do Spotify)
           
           Esta seção mostra o perfil do Spotify do artista incorporado.
           
           COMO FUNCIONA:
           - Cada artista pode ter um campo "spotifyEmbedId" com o ID do artista no Spotify
           - O ID é a parte final da URL do artista no Spotify
           - Exemplo: https://open.spotify.com/artist/2HiXSO6Cb6ObIrtLt47iAZ
           -          O ID seria: 2HiXSO6Cb6ObIrtLt47iAZ
           
           PERSONALIZAÇÕES DO EMBED:
           - theme=0: Tema escuro (preto/cinza) - combina com o site
           - theme=1: Tema claro (branco)
           - Para mudar a altura: altere o valor de height no iframe (padrão: 352px)
           - Para mudar a largura: o iframe usa 100% da largura do container
           
           COMO OBTER O ID DO SPOTIFY:
           1. Vá ao perfil do artista no Spotify
           2. Clique em "..." > Compartilhar > Copiar link do artista
           3. O link terá formato: https://open.spotify.com/artist/XXXXXXXXXX
           4. O ID é o código após "/artist/"
           ============================================ */
        .artist-discography {
            background-color: var(--cor-cinza);
            padding: 30px;
            border-radius: var(--card-radius);
            margin-bottom: 30px;
        }
        
        .artist-discography h2 {
            font-family: var(--fonte-titulo);
            font-size: 1.5rem;
            color: var(--cor-texto);
            margin-bottom: 20px;
        }
        
        /* 
        Container do iframe do Spotify
        - border-radius: mantém bordas arredondadas no embed
        - overflow: hidden: garante que o iframe respeite o border-radius
        */
        .spotify-embed-container {
            border-radius: 12px;
            overflow: hidden;
            background-color: #121212; /* Cor de fundo do Spotify enquanto carrega */
        }
        
        /* 
        Iframe do Spotify
        - width: 100%: ocupa toda a largura disponível
        - min-height: 352px: altura mínima recomendada pelo Spotify
        - border: none: remove borda padrão do iframe
        */
        .spotify-embed-container iframe {
            width: 100%;
            min-height: 352px;
            border: none;
            display: block;
        }
        
        /* Responsividade: em telas menores, pode ajustar a altura */
        @media (max-width: 480px) {
            .spotify-embed-container iframe {
                min-height: 300px;
            }
        }
        
        @media (min-width: 768px) {
            .artist-header {
                flex-direction: row;
                text-align: left;
                gap: 30px;
            }
            
            .artist-photo {
                margin-bottom: 0;
            }
        }
    </style>

       BANCO DE DADOS DOS ARTISTAS
       
       COMO ADICIONAR UM NOVO ARTISTA:
       1. Copie um bloco de artista existente

       3. Preencha os dados
       
       CAMPOS:
       - id: número único do artista
       - nome: nome artístico
       - categoria: mc, dj, breaking, graffiti, produtor, crew, batalha, banda, solo
       - cidade: cidade de origem
       - foto: URL da foto (pode ser link externo ou /images/artistas/nome.jpg)
       - biografia: texto sobre o artista (pode usar <br> para quebra de linha)
       - instagram: link completo do Instagram (ou null se não tiver)
       - youtube: link completo do YouTube (ou null se não tiver)
       - spotify: link completo do Spotify (ou null se não tiver)
       - soundcloud: link completo do SoundCloud (ou null se não tiver)
       - spotifyEmbedId: ID do artista no Spotify para incorporar o player (ou null se não tiver)
       
       ============================================
       COMO OBTER O SPOTIFY EMBED ID:
       
       1. Acesse o Spotify Web (open.spotify.com) ou app desktop
       2. Vá até o perfil do artista
       3. Clique nos 3 pontos (...) > Compartilhar > Incorporar artista
       4. No código gerado, encontre a URL no src do iframe
       5. O ID está após "/artist/" na URL
       
       Exemplo:
       - URL do embed: https://open.spotify.com/embed/artist/2HiXSO6Cb6ObIrtLt47iAZ
       - O spotifyEmbedId seria: "2HiXSO6Cb6ObIrtLt47iAZ"
       
       OU simplesmente:
       1. Copie o link do perfil do artista
       2. O ID é a parte final: https://open.spotify.com/artist/XXXXXXX
       3. Use o XXXXXXX como spotifyEmbedId
