    Esta página mostra informações detalhadas de um artista.
    O conteúdo é carregado via JavaScript baseado no ID da URL.
    
    COMO FUNCIONA:
    - A URL contém o ID do artista: artista.html?id=1
    - O JavaScript carrega os dados do artista correspondente
    - Você pode adicionar mais artistas no objeto 'artistsData' no script
    
    COMO ADICIONAR UM NOVO ARTISTA:
    1. No script abaixo, adicione um novo objeto no 'artistsData'
    2. Use um ID único (número)
    3. Preencha todas as informações do artista

    <style>
        /* Container principal do artista */
        .artist-profile {
            padding: 100px 20px 60px;
            max-width: 1000px;
            margin: 0 auto;
        }
        
        /* Cabeçalho do perfil */
        .artist-profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 50px;
        }
        
        /* Foto grande do artista */
        .artist-profile-image {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid var(--cor-vermelho);
            margin-bottom: 20px;
        }
        
        .artist-profile-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* Nome do artista */
        .artist-profile-name {
            font-family: var(--fonte-titulo);
            font-size: 2.5rem;
            margin-bottom: 5px;
            color: var(--cor-texto);
        }
        
        /* Cidade do artista */
        .artist-profile-city {
            font-size: 1.2rem;
            color: var(--cor-vermelho);
            margin-bottom: 20px;
        }
        
        /* Gênero musical */
        .artist-profile-genre {
            display: inline-block;
            background-color: var(--cor-cinza);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: var(--cor-bege);
            margin-bottom: 20px;
        }
        
        /* Links de redes sociais */
        .artist-social-links {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        
        .artist-social-link {
            width: 45px;
            height: 45px;
            background-color: var(--cor-cinza);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color var(--transition-rapida), transform var(--transition-rapida);
        }
        
        .artist-social-link:hover {
            background-color: var(--cor-vermelho);
            transform: scale(1.1);
        }
        
        .artist-social-link svg {
            width: 22px;
            height: 22px;
            fill: var(--cor-texto);
        }
        
        /* Biografia */
        .artist-bio-section {
            margin-bottom: 50px;
        }
        
        .artist-bio-title {
            font-family: var(--fonte-titulo);
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--cor-vermelho);
        }
        
        .artist-bio-text {
            color: var(--cor-bege);
            line-height: 1.8;
            text-align: justify;
        }
        
        /* Seção de álbuns do artista */
        .artist-albums-section {
            margin-top: 50px;
        }
        
        .artist-albums-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        
        /* Responsividade */
        @media (min-width: 768px) {
            .artist-profile-header {
                flex-direction: row;
                text-align: left;
                gap: 40px;
            }
            
            .artist-profile-image {
                width: 250px;
                height: 250px;
            }
            
            .artist-social-links {
                justify-content: flex-start;
            }
        }
    </style>

                container.innerHTML = `

                        <h1 class="section-title">Artista não encontrado</h1>
                        <p>O artista que você está procurando não existe.</p>
                        <a href="/" class="btn-ver-mais mt-40">Voltar ao Início</a>
                    </div>
                `;
